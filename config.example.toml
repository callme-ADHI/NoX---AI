[server]
host = "127.0.0.1"          # never 0.0.0.0 in Phase 1
port = 7777

[timezone]
name = "Asia/Kolkata"

[logging]
level = "INFO"              # DEBUG | INFO | WARNING | ERROR

[models.ollama]
base_url = "http://127.0.0.1:11434"
keep_alive = "30m"          # how long to keep the model loaded in Ollama
num_ctx = 8192              # context window size sent to Ollama

[models.roles]
brain  = { provider = "ollama", model = "qwen2.5:14b" }
embed  = { provider = "ollama", model = "nomic-embed-text" }
vision = { provider = "ollama", model = "gemma4:e4b" }      # reserved, unused in Phase 1
# Optional strong cloud role for PUBLIC data only. Disabled until a key exists.
heavy  = { provider = "nvidia", model = "nvidia/llama-3.3-nemotron-super-49b-v1.5" }

[models.nvidia]
enabled = true
base_url = "https://integrate.api.nvidia.com/v1"
requests_per_minute = 30   # stay under the ~40 RPM free limit
max_retries = 4

[agent]
max_steps_per_run = 12
max_subtasks = 8
max_depth = 2
worker_concurrency = 2
run_timeout_seconds = 900
tool_timeout_seconds = 60

[memory]
recall_top_k = 6
recall_token_budget = 800
episode_archive_days = 90

[safety]
allowed_file_roots = ["~"]
denied_paths = [
    "~/.ssh",
    "~/.gnupg",
    "~/.config/nox/secrets.env",
    "~/.mozilla",
    "~/.config/chromium",
    "~/.config/google-chrome",
]
approval_timeout_seconds = 300

[gate]
mode = "token_only"         # "off" | "token_only" | "command"
command = []                # e.g. ["facelock", "verify"]; exit code 0 = authenticated

[ui]
launcher_cmd = ["chromium", "--app={url}"]

[privacy]
chat_to_cloud = true          # send interactive chat turns to cloud when active
cloud_profile_card = false     # keep cloud-safe memory profile empty by default
private_mode = false           # toggle zero-egress private mode on demand

[keypool]
rpm_per_key = 35
concurrency_per_key = 2
reserve_interactive = true
cooldown_base_s = 5.0
cooldown_max_s = 120.0
wide_mode = true

[briefing]
enabled = true
timezone = "Asia/Kolkata"
morning_start = "04:00"
evening_start = "18:00"
catchup_on_boot = true
max_items_news_per_topic = 6
max_items_opportunities = 10
freshness_hours_news = 48
freshness_days_papers = 7
notify_on_start = false
notify_on_done = true
staging_retention_days = 3
run_timeout_minutes = 15
topic_timeout_minutes = 5

[research]
user_agent = "NoX-Research/1.0 (+https://github.com/callme-ADHI/NoX---AI)"
per_domain_rps = 1.0
fetch_timeout_s = 12.0
max_bytes = 1000000
cache_ttl_h = 24
deny_domains = ["pinterest.com", "quora.com"]
boost_domains = [
    "arxiv.org",
    "github.com",
    "news.ycombinator.com",
    "thehackernews.com",
]


