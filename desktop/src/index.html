<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #05060F;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(124, 156, 255, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 440px;
      padding: 2rem;
    }
    .logo-container {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #111116 0%, #1A1D2B 100%);
      border: 1px solid rgba(124, 156, 255, 0.2);
      box-shadow: 0 0 35px rgba(124, 156, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      animation: pulse 2.5s infinite ease-in-out;
    }
    .logo {
      width: 48px;
      height: 48px;
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 35px rgba(124, 156, 255, 0.15);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 50px rgba(124, 156, 255, 0.3);
      }
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      margin-bottom: 0.5rem;
    }
    .status-text {
      font-size: 0.95rem;
      color: #94A3B8;
      margin-bottom: 1.5rem;
      min-height: 1.4rem;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(124, 156, 255, 0.2);
      border-top-color: #7C9CFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .offline-box {
      display: none;
      flex-direction: column;
      align-items: center;
      background: rgba(26, 29, 43, 0.6);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 1.25rem;
      width: 100%;
    }
    .offline-title {
      color: #F87171;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }
    .offline-desc {
      color: #94A3B8;
      font-size: 0.85rem;
      line-height: 1.4;
      margin-bottom: 1rem;
    }
    .btn {
      background: #7C9CFF;
      color: #05060F;
      border: none;
      padding: 0.5rem 1.25rem;
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #9BB4FF;
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="content">
    <div class="logo-container">
      <svg class="logo" viewBox="0 0 100 100" fill="none">
        <path d="M52 18L26 56H48L44 82L74 44H52L52 18Z" fill="#7C9CFF"/>
      </svg>
    </div>
    <h1>NoX</h1>
    <div class="status-text" id="status-text">Starting NoX...</div>
    <div class="spinner" id="spinner"></div>

    <div class="offline-box" id="offline-box">
      <div class="offline-title">Daemon Not Reachable</div>
      <div class="offline-desc">
        Could not connect to NoX daemon on 127.0.0.1:7777. Ensure <code>noxd</code> is running or start it via systemd.
      </div>
      <button class="btn" onclick="retryConnect()">Retry Connection</button>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:7777";
    let attempts = 0;
    let daemonStarted = false;

    async function checkHealth() {
      let isHealthy = false;

      // 1. Primary: Native Tauri IPC check (avoids browser CORS)
      if (window.__TAURI__ && window.__TAURI__.core) {
        try {
          isHealthy = await window.__TAURI__.core.invoke("check_daemon_health");
        } catch (e) {
          console.warn("check_daemon_health invoke failed:", e);
        }
      }

      // 2. Fallback: Direct fetch
      if (!isHealthy) {
        try {
          const res = await fetch(`${API_BASE}/api/health`, { method: "GET", cache: "no-store" });
          isHealthy = res.ok;
        } catch (err) {
          // Daemon not yet ready or CORS blocked
        }
      }

      if (isHealthy) {
        document.getElementById("status-text").textContent = "Connected. Loading application...";

        let token = "";
        if (window.__TAURI__ && window.__TAURI__.core) {
          try {
            token = await window.__TAURI__.core.invoke("get_session_token");
          } catch (e) {
            console.warn("Failed to invoke get_session_token:", e);
          }
        }

        if (token) {
          sessionStorage.setItem("nox_token", token);
          localStorage.setItem("nox_token", token);
        }

        // Check for redirect path
        const urlParams = new URLSearchParams(window.location.search);
        const targetPath = urlParams.get("open") || "/";

        // Initial navigation exchanges token to set HttpOnly session cookie,
        // then the server 303 redirects cleanly to / or targetPath.
        if (token) {
          window.location.href = `${API_BASE}/?t=${encodeURIComponent(token)}`;
        } else {
          window.location.href = `${API_BASE}${targetPath}`;
        }
        return;
      }

      attempts++;

      // After 3 seconds, request daemon startup if running inside Tauri
      if (attempts >= 6 && !daemonStarted) {
        daemonStarted = true;
        document.getElementById("status-text").textContent = "Starting background daemon...";
        if (window.__TAURI__ && window.__TAURI__.core) {
          try {
            await window.__TAURI__.core.invoke("start_daemon");
          } catch (e) {
            console.warn("start_daemon invoke failed:", e);
          }
        }
      }

      // After 15 seconds, display offline retry box
      if (attempts >= 30) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status-text").style.display = "none";
        document.getElementById("offline-box").style.display = "flex";
        return;
      }

      setTimeout(checkHealth, 500);
    }

    function retryConnect() {
      attempts = 0;
      document.getElementById("spinner").style.display = "block";
      document.getElementById("status-text").style.display = "block";
      document.getElementById("status-text").textContent = "Connecting to NoX...";
      document.getElementById("offline-box").style.display = "none";
      checkHealth();
    }

    // Begin health polling
    setTimeout(checkHealth, 300);
  </script>
</body>
</html>
